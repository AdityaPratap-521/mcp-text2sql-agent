[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-text2sql-agent"
version = "1.0.0"
description = "Multi-Agent Intelligence system with MCP PostgreSQL/Hive Server, LangGraph orchestration, Claude Opus 4.1, and UAT validation"
authors = [{ name = "Aditya Pratap" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.1.23",
    "mcp>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "tabulate>=0.9.0",
    "sqlparse>=0.5.0",
    "python-dotenv>=1.0.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
