version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: mcp_postgres_analytics
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_password
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user -d analytics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp-text2sql-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mcp_text2sql_app
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      - DB_TYPE=postgres
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=analytics_db
      - DB_USER=analytics_user
      - DB_PASSWORD=analytics_password
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - AUTO_UAT_APPROVAL=true
    command: python main.py --query "Show total sales volume and revenue by product category"

volumes:
  pgdata:
