apiVersion: v1
kind: ConfigMap
metadata:
  name: text2sql-staging-config
  namespace: analytics-staging
data:
  DB_TYPE: "postgres"
  DB_HOST: "postgres-staging-service"
  DB_PORT: "5432"
  DB_NAME: "analytics_db"
  DB_USER: "analytics_user"
  MCP_TRANSPORT: "stdio"
  AUTO_UAT_APPROVAL: "true"
  MAX_REVISION_CYCLES: "3"
